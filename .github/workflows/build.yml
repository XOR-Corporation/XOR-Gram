name: Build XORGram APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configureondemand=true
    -Xmx4g -Xms512m
    -XX:+UseParallelGC

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            TMessagesProj/build
            TMessagesProj_App/build
            !TMessagesProj_App/build/outputs
          key: android-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: android-build-

      - name: Determine build type
        id: build-type
        run: |
          IS_RELEASE=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Build type: $([ "$IS_RELEASE" = "true" ] && echo 'Release + Debug' || echo 'Debug only')"

      - name: Generate build configuration files
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          # === 1. BuildVars.java ===
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger

          APP_ID="${TELEGRAM_APP_ID:-4}"
          APP_HASH="${TELEGRAM_APP_HASH:-014b35b6184100b085b0d0572f9b5103}"

          sed \
            -e "s/APP_ID_PLACEHOLDER/${APP_ID}/g" \
            -e "s/APP_HASH_PLACEHOLDER/${APP_HASH}/g" \
            -e "s/SAFETYNET_KEY_PLACEHOLDER/${SAFETYNET_KEY:-}/g" \
            -e "s/GOOGLE_AUTH_CLIENT_ID_PLACEHOLDER/${GOOGLE_AUTH_CLIENT_ID:-}/g" \
            .github/templates/BuildVars.java.tpl \
            > TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java \
            2>/dev/null || {
              # Fallback: inline template if .tpl not found
              cat > TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java << BVEOF
          package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import com.android.billingclient.api.ProductDetails;
          import java.util.Objects;

          public class BuildVars {
              public static boolean DEBUG_VERSION = BuildConfig.DEBUG_VERSION;
              public static boolean LOGS_ENABLED = BuildConfig.DEBUG_VERSION;
              public static boolean DEBUG_PRIVATE_VERSION = BuildConfig.DEBUG_PRIVATE_VERSION;
              public static boolean USE_CLOUD_STRINGS = true;
              public static boolean CHECK_UPDATES = true;
              public static boolean NO_SCOPED_STORAGE = Build.VERSION.SDK_INT <= 29;
              public static String BUILD_VERSION_STRING = BuildConfig.BUILD_VERSION_STRING;
              public static int APP_ID = ${APP_ID};
              public static String APP_HASH = "${APP_HASH}";
              public static String SAFETYNET_KEY = "${SAFETYNET_KEY:-}";
              public static String PLAYSTORE_APP_URL = "https://play.google.com/store/apps/details?id=org.xor.gram";
              public static String GOOGLE_AUTH_CLIENT_ID = "${GOOGLE_AUTH_CLIENT_ID:-}";
              public static boolean IS_BILLING_UNAVAILABLE = false;
              public static boolean SUPPORTS_PASSKEYS = true;

              static {
                  if (ApplicationLoader.applicationContext != null) {
                      SharedPreferences sharedPreferences = ApplicationLoader.applicationContext.getSharedPreferences("systemConfig", Context.MODE_PRIVATE);
                      LOGS_ENABLED = DEBUG_VERSION || sharedPreferences.getBoolean("logsEnabled", DEBUG_VERSION);
                      if (LOGS_ENABLED) {
                          final Thread.UncaughtExceptionHandler pastHandler = Thread.getDefaultUncaughtExceptionHandler();
                          Thread.setDefaultUncaughtExceptionHandler((thread, exception) -> {
                              FileLog.fatal(exception, false);
                              if (pastHandler != null) { pastHandler.uncaughtException(thread, exception); }
                          });
                      }
                  }
              }

              public static boolean useInvoiceBilling() {
                  return BillingController.billingClientEmpty || DEBUG_VERSION && false || ApplicationLoader.isStandaloneBuild() || isBetaApp() && false || hasDirectCurrency();
              }

              private static boolean hasDirectCurrency() {
                  if (!BillingController.getInstance().isReady() || BillingController.PREMIUM_PRODUCT_DETAILS == null) return false;
                  for (ProductDetails.SubscriptionOfferDetails offerDetails : BillingController.PREMIUM_PRODUCT_DETAILS.getSubscriptionOfferDetails()) {
                      for (ProductDetails.PricingPhase phase : offerDetails.getPricingPhases().getPricingPhaseList()) {
                          for (String cur : MessagesController.getInstance(UserConfig.selectedAccount).directPaymentsCurrency) {
                              if (Objects.equals(phase.getPriceCurrencyCode(), cur)) return true;
                          }
                      }
                  }
                  return false;
              }

              private static Boolean betaApp;
              public static boolean isBetaApp() {
                  if (betaApp == null) betaApp = ApplicationLoader.applicationContext != null && "org.xor.gram.beta".equals(ApplicationLoader.applicationContext.getPackageName());
                  return betaApp;
              }

              public static boolean isHuaweiStoreApp() { return false; }

              public static String getSmsHash() {
                  return ApplicationLoader.isStandaloneBuild() ? "w0lkcmTZkKh" : (DEBUG_VERSION ? "O2P2z+/jBpJ" : "oLeq9AcOZkT");
              }
          }
          BVEOF
            }

          echo "✅ BuildVars.java generated"

          # === 2. google-services.json ===
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > /dev/null
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj/google-services.json 2>/dev/null \
              || echo "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json
          else
            cat > TMessagesProj/google-services.json << 'GSEOF'
          {"project_info":{"project_number":"123456789012","project_id":"xorgram-dev","storage_bucket":"xorgram-dev.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"org.telegram.messenger"}},"oauth_client":[{"client_id":"123456789012-placeholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForDevOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567891","android_client_info":{"package_name":"org.xor.gram"}},"oauth_client":[{"client_id":"123456789012-placeholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForDevOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          GSEOF
          fi
          cp TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          echo "✅ google-services.json generated"

          # === 3. Keystore ===
          mkdir -p TMessagesProj/config
          KEYSTORE_PATH="TMessagesProj/config/release.keystore"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-androidkey}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-android}"
          STORE_PASS="${RELEASE_STORE_PASSWORD:-android}"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH" 2>/dev/null || {
              echo "⚠️ Base64 decode failed, generating debug keystore"
              RELEASE_KEYSTORE_BASE64=""
            }
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=XORGram, OU=XOR, O=XOR, L=Unknown, ST=Unknown, C=XX" 2>/dev/null
          fi
          echo "✅ Keystore ready"

          # === 4. Gradle properties ===
          sed -i \
            -e "s/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=${KEY_PASS}/" \
            -e "s/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=${KEY_ALIAS}/" \
            -e "s/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=${STORE_PASS}/" \
            gradle.properties
          echo "✅ Gradle properties configured"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace --build-cache

      - name: Build Release APK
        if: steps.build-type.outputs.is_release == 'true'
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace --build-cache || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xorgram-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          retention-days: 14
          compression-level: 0  # APK already compressed

      - name: Upload Release APK
        if: steps.build-type.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xorgram-release
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          retention-days: 14
          compression-level: 0

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🔧 XORGram Build Summary"
            echo ""
            echo "| Artifact | Status |"
            echo "|----------|--------|"

            for type in debug release; do
              path="TMessagesProj_App/build/outputs/apk/afat/${type}"
              if ls ${path}/*.apk 1>/dev/null 2>&1; then
                size=$(du -sh ${path}/*.apk | cut -f1)
                echo "| ${type^} APK | ✅ Built (${size}) |"
              else
                echo "| ${type^} APK | ❌ Not built |"
              fi
            done

            echo ""
            echo "<details><summary>📋 Required Secrets</summary>"
            echo ""
            echo "| Secret | Required | Description |"
            echo "|--------|----------|-------------|"
            echo "| \`TELEGRAM_APP_ID\` | ⚠️ | Telegram API ID |"
            echo "| \`TELEGRAM_APP_HASH\` | ⚠️ | Telegram API Hash |"
            echo "| \`RELEASE_KEYSTORE_BASE64\` | For release | Base64 keystore |"
            echo "| \`RELEASE_KEY_PASSWORD\` | For release | Key password |"
            echo "| \`RELEASE_KEY_ALIAS\` | For release | Key alias |"
            echo "| \`RELEASE_STORE_PASSWORD\` | For release | Store password |"
            echo "| \`GOOGLE_SERVICES_JSON\` | Optional | Base64 google-services.json |"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
