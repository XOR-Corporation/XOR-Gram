name: Build XORGram APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Generate BuildVars.java from secrets
    - name: Generate BuildVars.java
      env:
        TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
        TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
        GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
        HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        HUAWEI_STORE_URL: ${{ secrets.HUAWEI_STORE_URL }}
      run: |
        mkdir -p TMessagesProj/src/main/java/org/telegram/messenger
        
        # Set defaults
        APP_ID="${TELEGRAM_APP_ID:-4}"
        APP_HASH="${TELEGRAM_APP_HASH:-014b35b6184100b085b0d0572f9b5103}"
        SAFETYNET_KEY="${SAFETYNET_KEY:-}"
        GOOGLE_AUTH_CLIENT_ID="${GOOGLE_AUTH_CLIENT_ID:-}"
        HUAWEI_APP_ID="${HUAWEI_APP_ID:-}"
        HUAWEI_STORE_URL="${HUAWEI_STORE_URL:-https://appgallery.huawei.com/app/C101184875}"
        
        cat > TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java << EOF
        /* This file is auto-generated by GitHub Actions */
        package org.telegram.messenger;

        import android.content.Context;
        import android.content.SharedPreferences;
        import android.os.Build;

        import com.android.billingclient.api.ProductDetails;

        import java.util.Objects;

        public class BuildVars {

            public static boolean DEBUG_VERSION = BuildConfig.DEBUG_VERSION;
            public static boolean LOGS_ENABLED = BuildConfig.DEBUG_VERSION;
            public static boolean DEBUG_PRIVATE_VERSION = BuildConfig.DEBUG_PRIVATE_VERSION;
            public static boolean USE_CLOUD_STRINGS = true;
            public static boolean CHECK_UPDATES = true;
            public static boolean NO_SCOPED_STORAGE = Build.VERSION.SDK_INT <= 29;
            public static String BUILD_VERSION_STRING = BuildConfig.BUILD_VERSION_STRING;

            // API credentials from GitHub Secrets
            public static int APP_ID = ${APP_ID};
            public static String APP_HASH = "${APP_HASH}";

            // SafetyNet key
            public static String SAFETYNET_KEY = "${SAFETYNET_KEY}";
            
            // Store URLs
            public static String PLAYSTORE_APP_URL = "https://play.google.com/store/apps/details?id=org.xor.gram";
            public static String HUAWEI_STORE_URL = "${HUAWEI_STORE_URL}";
            
            // Google Auth
            public static String GOOGLE_AUTH_CLIENT_ID = "${GOOGLE_AUTH_CLIENT_ID}";

            // Huawei App ID
            public static String HUAWEI_APP_ID = "${HUAWEI_APP_ID}";

            // Billing
            public static boolean IS_BILLING_UNAVAILABLE = false;
            public static boolean SUPPORTS_PASSKEYS = true;

            static {
                if (ApplicationLoader.applicationContext != null) {
                    SharedPreferences sharedPreferences = ApplicationLoader.applicationContext.getSharedPreferences("systemConfig", Context.MODE_PRIVATE);
                    LOGS_ENABLED = DEBUG_VERSION || sharedPreferences.getBoolean("logsEnabled", DEBUG_VERSION);
                    if (LOGS_ENABLED) {
                        final Thread.UncaughtExceptionHandler pastHandler = Thread.getDefaultUncaughtExceptionHandler();
                        Thread.setDefaultUncaughtExceptionHandler((thread, exception) -> {
                            FileLog.fatal(exception, false);
                            if (pastHandler != null) {
                                pastHandler.uncaughtException(thread, exception);
                            }
                        });
                    }
                }
            }

            public static boolean useInvoiceBilling() {
                return BillingController.billingClientEmpty || DEBUG_VERSION && false || ApplicationLoader.isStandaloneBuild() || isBetaApp() && false || isHuaweiStoreApp() || hasDirectCurrency();
            }

            private static boolean hasDirectCurrency() {
                if (!BillingController.getInstance().isReady() || BillingController.PREMIUM_PRODUCT_DETAILS == null) {
                    return false;
                }
                for (ProductDetails.SubscriptionOfferDetails offerDetails : BillingController.PREMIUM_PRODUCT_DETAILS.getSubscriptionOfferDetails()) {
                    for (ProductDetails.PricingPhase phase : offerDetails.getPricingPhases().getPricingPhaseList()) {
                        for (String cur : MessagesController.getInstance(UserConfig.selectedAccount).directPaymentsCurrency) {
                            if (Objects.equals(phase.getPriceCurrencyCode(), cur)) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            private static Boolean betaApp;
            public static boolean isBetaApp() {
                if (betaApp == null) {
                    betaApp = ApplicationLoader.applicationContext != null && "org.xor.gram.beta".equals(ApplicationLoader.applicationContext.getPackageName());
                }
                return betaApp;
            }

            public static boolean isHuaweiStoreApp() {
                return ApplicationLoader.isHuaweiStoreBuild();
            }

            public static String getSmsHash() {
                return ApplicationLoader.isStandaloneBuild() ? "w0lkcmTZkKh" : (DEBUG_VERSION ? "O2P2z+/jBpJ" : "oLeq9AcOZkT");
            }
        }
        EOF

    # Generate google-services.json from secret
    - name: Generate google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_App/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_AppHockeyApp/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj_AppStandalone/google-services.json
        else
          echo "GOOGLE_SERVICES_JSON secret not set, using placeholder"
          # Create placeholder google-services.json
          cat > TMessagesProj/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "",
              "firebase_url": "",
              "project_id": "",
              "storage_bucket": ""
            },
            "client": [],
            "configuration_version": "1"
          }
          GSEOF
          cp TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          cp TMessagesProj/google-services.json TMessagesProj_AppHockeyApp/google-services.json
          cp TMessagesProj/google-services.json TMessagesProj_AppStandalone/google-services.json
        fi

    # Generate release.keystore from secret
    - name: Generate release.keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
        else
          echo "RELEASE_KEYSTORE_BASE64 secret not set, creating debug keystore"
          # Create a temporary debug keystore if not provided
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
            -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=XORGram, OU=XOR, O=XOR, L=Unknown, ST=Unknown, C=XX"
        fi

    # Configure gradle.properties with secrets
    - name: Configure keystore properties
      env:
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      run: |
        KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-android}"
        KEY_ALIAS="${RELEASE_KEY_ALIAS:-androidkey}"
        STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-android}"
        
        sed -i "s/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=${KEY_PASSWORD}/" gradle.properties
        sed -i "s/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=${KEY_ALIAS}/" gradle.properties
        sed -i "s/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=${STORE_PASSWORD}/" gradle.properties

    # Build Debug APK
    - name: Build Debug APK
      run: |
        ./gradlew :TMessagesProj:assembleDebug --no-daemon --stacktrace

    # Build Release APK (only on main/master)
    - name: Build Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        ./gradlew :TMessagesProj:assembleRelease --no-daemon --stacktrace || true

    # Upload Debug APK
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: xrogram-debug
        path: TMessagesProj/build/outputs/apk/debug/*.apk
        retention-days: 14

    # Upload Release APK
    - name: Upload Release APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: xrogram-release
        path: TMessagesProj/build/outputs/apk/release/*.apk
        retention-days: 14

    - name: Generate build summary
      if: always()
      run: |
        echo "## XORGram Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "TMessagesProj/build/outputs/apk/debug/"*.apk ]; then
          echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
          ls -la TMessagesProj/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Debug APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Required GitHub Secrets" >> $GITHUB_STEP_SUMMARY
        echo "To build full APKs, configure these secrets in repository settings:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Secret | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| \`TELEGRAM_APP_ID\` | Telegram API ID (from my.telegram.org) |" >> $GITHUB_STEP_SUMMARY
        echo "| \`TELEGRAM_APP_HASH\` | Telegram API Hash (from my.telegram.org) |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEYSTORE_BASE64\` | Base64-encoded release keystore |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEY_PASSWORD\` | Keystore password |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEY_ALIAS\` | Key alias |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_STORE_PASSWORD\` | Key password |" >> $GITHUB_STEP_SUMMARY
        echo "| \`GOOGLE_SERVICES_JSON\` | google-services.json content |" >> $GITHUB_STEP_SUMMARY
