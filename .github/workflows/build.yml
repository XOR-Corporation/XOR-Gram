name: Build XORGram APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Enable all performance optimizations (without configuration-cache - incompatible with TMessagesProj)
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4 -Xmx4g"
  # Pre-download dependencies to speed up builds
  GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    # Use larger runner for faster builds
    container:
      image: ghcr.io/cirruslabs/android-sdk:34
      options: --user root

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # Setup Gradle with caching
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    # Generate all config files in one step
    - name: Generate config files
      env:
        TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
        TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
        GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      run: |
        set -e
        
        # Set defaults
        APP_ID="${TELEGRAM_APP_ID:-4}"
        APP_HASH="${TELEGRAM_APP_HASH:-014b35b6184100b085b0d0572f9b5103}"
        SAFETYNET_KEY="${SAFETYNET_KEY:-}"
        GOOGLE_AUTH_CLIENT_ID="${GOOGLE_AUTH_CLIENT_ID:-}"
        
        # Generate BuildVars.java
        mkdir -p TMessagesProj/src/main/java/org/telegram/messenger
        cat > TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java << 'BVEOF'
        /* This file is auto-generated by GitHub Actions */
        package org.telegram.messenger;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.os.Build;
        import com.android.billingclient.api.ProductDetails;
        import java.util.Objects;

        public class BuildVars {
            public static boolean DEBUG_VERSION = BuildConfig.DEBUG_VERSION;
            public static boolean LOGS_ENABLED = BuildConfig.DEBUG_VERSION;
            public static boolean DEBUG_PRIVATE_VERSION = BuildConfig.DEBUG_PRIVATE_VERSION;
            public static boolean USE_CLOUD_STRINGS = true;
            public static boolean CHECK_UPDATES = true;
            public static boolean NO_SCOPED_STORAGE = Build.VERSION.SDK_INT <= 29;
            public static String BUILD_VERSION_STRING = BuildConfig.BUILD_VERSION_STRING;
            public static int APP_ID = APP_ID_PLACEHOLDER;
            public static String APP_HASH = "APP_HASH_PLACEHOLDER";
            public static String SAFETYNET_KEY = "SAFETYNET_KEY_PLACEHOLDER";
            public static String PLAYSTORE_APP_URL = "https://play.google.com/store/apps/details?id=org.xor.gram";
            public static String GOOGLE_AUTH_CLIENT_ID = "GOOGLE_AUTH_CLIENT_ID_PLACEHOLDER";
            public static boolean IS_BILLING_UNAVAILABLE = false;
            public static boolean SUPPORTS_PASSKEYS = true;

            static {
                if (ApplicationLoader.applicationContext != null) {
                    SharedPreferences sharedPreferences = ApplicationLoader.applicationContext.getSharedPreferences("systemConfig", Context.MODE_PRIVATE);
                    LOGS_ENABLED = DEBUG_VERSION || sharedPreferences.getBoolean("logsEnabled", DEBUG_VERSION);
                    if (LOGS_ENABLED) {
                        final Thread.UncaughtExceptionHandler pastHandler = Thread.getDefaultUncaughtExceptionHandler();
                        Thread.setDefaultUncaughtExceptionHandler((thread, exception) -> {
                            FileLog.fatal(exception, false);
                            if (pastHandler != null) {
                                pastHandler.uncaughtException(thread, exception);
                            }
                        });
                    }
                }
            }

            public static boolean useInvoiceBilling() {
                return BillingController.billingClientEmpty || DEBUG_VERSION && false || ApplicationLoader.isStandaloneBuild() || isBetaApp() && false || hasDirectCurrency();
            }

            private static boolean hasDirectCurrency() {
                if (!BillingController.getInstance().isReady() || BillingController.PREMIUM_PRODUCT_DETAILS == null) {
                    return false;
                }
                for (ProductDetails.SubscriptionOfferDetails offerDetails : BillingController.PREMIUM_PRODUCT_DETAILS.getSubscriptionOfferDetails()) {
                    for (ProductDetails.PricingPhase phase : offerDetails.getPricingPhases().getPricingPhaseList()) {
                        for (String cur : MessagesController.getInstance(UserConfig.selectedAccount).directPaymentsCurrency) {
                            if (Objects.equals(phase.getPriceCurrencyCode(), cur)) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            private static Boolean betaApp;
            public static boolean isBetaApp() {
                if (betaApp == null) {
                    betaApp = ApplicationLoader.applicationContext != null && "org.xor.gram.beta".equals(ApplicationLoader.applicationContext.getPackageName());
                }
                return betaApp;
            }

            public static boolean isHuaweiStoreApp() { return false; }

            public static String getSmsHash() {
                return ApplicationLoader.isStandaloneBuild() ? "w0lkcmTZkKh" : (DEBUG_VERSION ? "O2P2z+/jBpJ" : "oLeq9AcOZkT");
            }
        }
        BVEOF

        # Replace placeholders
        sed -i "s/APP_ID_PLACEHOLDER/${APP_ID}/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i "s/APP_HASH_PLACEHOLDER/${APP_HASH}/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i "s/SAFETYNET_KEY_PLACEHOLDER/${SAFETYNET_KEY}/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i "s/GOOGLE_AUTH_CLIENT_ID_PLACEHOLDER/${GOOGLE_AUTH_CLIENT_ID}/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

        # Generate google-services.json for both modules
        GS_JSON='{"project_info":{"project_number":"123456789012","project_id":"xorgram-dev","storage_bucket":"xorgram-dev.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"org.telegram.messenger"}},"oauth_client":[{"client_id":"123456789012-abcdefghijklmnopqrstuvwxyz.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForDevOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567891","android_client_info":{"package_name":"org.xor.gram"}},"oauth_client":[{"client_id":"123456789012-abcdefghijklmnopqrstuvwxyz.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForDevOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
        
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > /tmp/gs.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > /tmp/gs.json
            cp /tmp/gs.json TMessagesProj/google-services.json
            cp /tmp/gs.json TMessagesProj_App/google-services.json
        else
            echo "$GS_JSON" > TMessagesProj/google-services.json
            echo "$GS_JSON" > TMessagesProj_App/google-services.json
        fi

        # Generate keystore
        mkdir -p TMessagesProj/config
        KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-android}"
        KEY_ALIAS="${RELEASE_KEY_ALIAS:-androidkey}"
        STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-android}"
        
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            CLEANED_BASE64=$(echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ')
            echo "$CLEANED_BASE64" | base64 -d > TMessagesProj/config/release.keystore 2>/dev/null || {
                echo "Failed to decode keystore, generating debug keystore"
                keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
                    -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
                    -storepass android -keypass android \
                    -dname "CN=XORGram, OU=XOR, O=XOR, L=Unknown, ST=Unknown, C=XX" 2>/dev/null
            }
        else
            keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore \
                -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=XORGram, OU=XOR, O=XOR, L=Unknown, ST=Unknown, C=XX" 2>/dev/null
        fi

        # Update gradle.properties
        sed -i "s/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=${KEY_PASSWORD}/" gradle.properties
        sed -i "s/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=${KEY_ALIAS}/" gradle.properties
        sed -i "s/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=${STORE_PASSWORD}/" gradle.properties

    # Apply XORGram patches (namespace change, R/BuildConfig imports)
    - name: Apply XORGram patches
      run: |
        chmod +x scripts/apply_patches.sh
        ./scripts/apply_patches.sh

        # Single build step - debug only for PRs/pushes, release for tags
    - name: Build APK
      run: |
        chmod +x gradlew

        # Build debug APK (always)
        ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --parallel --build-cache

        # Build release APK only for tags or main/master
        if [[ "${GITHUB_REF}" == refs/tags/* ]] || [[ "${GITHUB_REF}" == "refs/heads/main" ]] || [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --parallel --build-cache || true
        fi

    # Upload Debug APK
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: xorggram-debug
        path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
        retention-days: 14
        if-no-files-found: error

    # Upload Release APK
    - name: Upload Release APK
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: xorggram-release
        path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
        retention-days: 30

    - name: Generate build summary
      if: always()
      run: |
        echo "## XORGram Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if ls TMessagesProj_App/build/outputs/apk/afat/debug/*.apk 1> /dev/null 2>&1; then
            echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
            ls -lh TMessagesProj_App/build/outputs/apk/afat/debug/*.apk >> $GITHUB_STEP_SUMMARY
        else
            echo "❌ Debug APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Required GitHub Secrets" >> $GITHUB_STEP_SUMMARY
        echo "Configure these secrets in repository settings:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Secret | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| \`TELEGRAM_APP_ID\` | Telegram API ID (from my.telegram.org) |" >> $GITHUB_STEP_SUMMARY
        echo "| \`TELEGRAM_APP_HASH\` | Telegram API Hash (from my.telegram.org) |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEYSTORE_BASE64\` | Base64-encoded keystore file |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEY_PASSWORD\` | Keystore password |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_KEY_ALIAS\` | Key alias |" >> $GITHUB_STEP_SUMMARY
        echo "| \`RELEASE_STORE_PASSWORD\` | Key password |" >> $GITHUB_STEP_SUMMARY
        echo "| \`GOOGLE_SERVICES_JSON\` | Base64-encoded google-services.json |" >> $GITHUB_STEP_SUMMARY
